name: CI

on:
  push:
  pull_request:

env:
  # Valeurs factices : suffisent pour que Django démarre en environnement de
  # test (config/settings/test.py, base SQLite en mémoire) sans jamais
  # envoyer de vrais e-mails ni appeler la vraie API CinetPay. Les vraies
  # valeurs restent uniquement dans le .env de production, jamais commitées.
  SECRET_KEY: ci-test-secret-key-not-for-production
  EMAIL_HOST_USER: ci-test@example.com
  EMAIL_HOST_PASSWORD: ci-test-password
  CINETPAY_API_KEY: ci-test-key
  CINETPAY_SITE_ID: ci-test-site-id

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff black
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest --cov=apps --cov-report=term-missing

  # Déploiement sur le VPS OVH : uniquement sur `main`, et seulement si les
  # tests passent. Sans le secret VPS_HOST, le job est ignoré. Secrets de dépôt
  # à créer : VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS (voir
  # docs/DEPLOIEMENT_OVH.md).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-vps
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4
        if: env.VPS_HOST != ''
      - name: Configurer SSH
        if: env.VPS_HOST != ''
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Déployer
        if: env.VPS_HOST != ''
        run: sh deploy/deployer.sh "$VPS_USER@$VPS_HOST"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
