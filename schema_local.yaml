  /api/ia/cours/{cours_id}/chat/:
    post:
      operationId: api_ia_cours_chat_create
      description: |-
        Envoie un message (texte, optionnellement accompagné d'une image et/ou d'un audio) au tuteur Yéki IA dans le contexte d'un cours. P10.1 : le débit se fait APRÈS l'appel à Claude, sur le coût RÉEL des tokens effectivement consommés — jamais une estimation débitée avant puis « ajustée » (l'ancien flux pouvait sous-facturer silencieusement). Si le solde est sous le minimum (`ParametreSysteme['solde_min_ia']`), retourne 402 avec le détail `{detail, solde_actuel, minimum_requis, cout_estime_min, cout_estime_max}` SANS appeler l'API Claude (aucune dépense engagée). En cas d'échec de l'appel à l'API Claude, retourne 503 SANS AUCUN DÉBIT ET SANS message assistant persisté — plus de réponse simulée facturée.

        Réponse 200 : `{reponse, message_id, assistant_id, tokens_input, tokens_output, cout_xaf, solde_avant, solde_restant, debit_ok}`. Limité par `throttle_scope='ia'` (facturation au token, anti-abus).
      summary: Envoyer un message à Yéki IA (facturé au wallet, débit après appel)
      parameters:
      - in: path
        name: cours_id
        schema:
          type: integer
        required: true
      tags:
      - ia
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          application/json:
            schema:
              type: object
              additionalProperties: {}
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
