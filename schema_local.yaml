        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/wallet/recharger/:
    post:
      operationId: api_wallet_recharger_create
      description: |-
        Recharge le wallet Yéki de l'utilisateur connecté via l'un des moyens suivants (`moyen` dans le corps) :
        - `google_play` : vérifie un achat in-app via Google Play Developer API (`purchase_token`, `sku`) — crédite le wallet ou active un abonnement premium selon le SKU. Anti-rejeu : un `purchase_token` déjà enregistré est refusé (400).
        - `mtn_momo` / `orange_om` : recharge Mobile Money (`montant`, `telephone`) — simulée automatiquement en mode DEBUG, sinon retourne 503 (intégration SDK non branchée en production).

        Réponse 200 typique : `{statut, solde, montant, detail, ...}`. Limité par `throttle_scope='paiement'` (anti-spam).
      summary: Recharger le wallet Yéki
      tags:
      - paiement
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/wallet/solde/:
    get:
      operationId: api_wallet_solde_retrieve
      description: Retourne le solde courant du wallet Yéki de l'utilisateur connecté
        (créé automatiquement s'il n'existe pas encore), les totaux cumulés de recharge/dépense,
        ainsi que les 30 dernières transactions (`id, type, montant, description,
        cree_le`).
      summary: Solde et transactions récentes du wallet Yéki
      tags:
      - paiement
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/wallet/verifier-iap/:
    post:
      operationId: api_wallet_verifier_iap_create
      description: |-
        Vérifie un achat in-app Google Play (`purchase_token`, `sku`) effectué côté client mobile et crédite le wallet Yéki en conséquence — délègue entièrement à la logique de `WalletRechargerView._google_play()`. Peut lever `PaymentRequiredError` (402) si l'achat n'est pas valide auprès de l'API Google Play Developer.

        Réponse 200 : `{statut, solde, montant, detail, sku}` (recharge) ou `{statut, detail, montant}` (abonnement premium).
      summary: Vérifier un achat Google Play (IAP) et créditer le wallet
      tags:
      - paiement
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
