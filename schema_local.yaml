  /api/paiements/cinetpay/initier/:
    post:
      operationId: api_paiements_cinetpay_initier_create
      description: |-
        Crée une transaction CinetPay (Mobile Money MTN/Orange ou carte) et retourne l'URL de paiement à ouvrir côté client. Utilisé pour recharger le wallet, accéder à un département, s'inscrire à une olympiade ou souscrire un abonnement premium (mensuel/annuel). La transaction est créée avec le statut `pending` ; elle sera confirmée de façon asynchrone par le webhook `CinetPayWebhookView`.

        Réponse 200 : `{reference, payment_url, status, message}`.
        Limité par `throttle_scope='paiement'` (anti-spam).
      summary: Initier un paiement CinetPay
      tags:
      - paiement
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/paiements/cinetpay/notify/:
    post:
      operationId: api_paiements_cinetpay_notify_create
      description: |-
        **Webhook serveur-à-serveur** appelé directement par la plateforme CinetPay après le traitement d'un paiement — ce n'est PAS un endpoint destiné à être appelé par un utilisateur final ou l'app mobile/web Yéki. Volontairement sans authentification utilisateur (`AllowAny`, `authentication_classes=[]`) puisque CinetPay ne porte pas de token Yéki, et sans `throttle_scope` (le volume est dicté par CinetPay, pas par un client abusif) — voir docs/API_FOUNDATIONS.md pour le contexte exact de ce choix.

        Selon le statut reçu (`cpm_result`/`status`), met à jour la transaction et, en cas de succès, crédite le wallet, active l'abonnement premium ou confirme l'inscription à l'olympiade concernée. Réponse 200 : `{status: 'ok'|'already_processed'}`.
      summary: Webhook de notification CinetPay (serveur à serveur)
      tags:
      - paiement
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/paiements/cinetpay/verifier/{reference}/:
    get:
      operationId: api_paiements_cinetpay_verifier_retrieve
      description: |-
        Retourne le statut actuel (`pending`, `success`, `failed`) d'une transaction CinetPay identifiée par sa référence, appartenant à l'utilisateur connecté. Tente en plus un rafraîchissement optionnel auprès de l'API CinetPay (best-effort, non bloquant) ; la source de vérité reste le statut déjà mis à jour en base par le webhook.

        Réponse 200 : `{reference, status, amount, created_at}`.
      summary: Vérifier le statut d'une transaction CinetPay
